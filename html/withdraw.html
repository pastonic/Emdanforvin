<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw Funds</title>
<link rel="icon" type="image/png" href="images/logo.png">

<link rel="stylesheet" href="css/withdraw.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

</head>

<body>
    <a href="dashboard.html" class="back-btn">
    ← Back to Dashboard
</a>

<div class="container">

    <div class="withdraw-card">

        <h2>

            <i class="fa-solid fa-money-bill-wave"></i>

            Withdraw Funds

        </h2>

        <p class="subtitle">

            Withdrawals are processed only on <strong>Fridays</strong>.

            Minimum withdrawal is <strong>GHS 90.00</strong>.

        </p>

        <div class="wallets">

            <div class="wallet">

                <h4>Question Wallet</h4>

                <h2 id="questionWallet">

                    GHS 0.00

                </h2>

            </div>

            <div class="wallet">

                <h4>Referral Wallet</h4>

                <h2 id="referralWallet">

                    GHS 0.00

                </h2>

            </div>

        </div>

        <form id="withdrawForm">

            <label>

                Withdraw From

            </label>

            <select id="walletType" required>

                <option value="Question">

                    Question Wallet

                </option>

                <option value="Referral">

                    Referral Wallet

                </option>

            </select>

            <label>

                Amount (GHS)

            </label>

            <input
            type="number"
            id="amount"
            min="90"
            step="0.01"
            placeholder="Enter amount"
            required>

            <label>

                Mobile Money Name

            </label>

            <input
            type="text"
            id="momoName"
            placeholder="Account Name"
            required>

            <label>

                Mobile Money Number

            </label>

            <input
            type="tel"
            id="momoNumber"
            placeholder="024XXXXXXX"
            required>

            <label>

                Network

            </label>

            <select id="network" required>

                <option value="MTN">

                    MTN MoMo

                </option>

                <option value="Telecel">

                    Telecel Cash

                </option>

                <option value="AirtelTigo">

                    AirtelTigo Money

                </option>

            </select>

            <button
            type="submit"
            class="withdraw-btn">

                <i class="fa-solid fa-paper-plane"></i>

                Request Withdrawal

            </button>

        </form>

    </div>

    <div class="history-card">

        <h3>

            <i class="fa-solid fa-clock-rotate-left"></i>

            Withdrawal History

        </h3>

        <table>

            <thead>

                <tr>

                    <th>Date</th>

                    <th>Wallet</th>

                    <th>Amount</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="historyBody">

                <tr>

                    <td colspan="4">

                        No withdrawal history yet.

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<script src="js/withdraw.js"></script>

</body>

</html>
