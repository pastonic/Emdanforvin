<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Login</title>

<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Emdanforvin</h1>

        <h3>Welcome Back</h3>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">

                Login

            </button>

        </form>

        <p>

            Don't have an account?

            <a href="register.html">

                Register

            </a>

        </p>

    </div>

</div>

<script src="js/login.js"></script>

</body>

</html>
