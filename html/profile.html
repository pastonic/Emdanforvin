<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<link rel="stylesheet" href="css/profile.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>
    <a href="dashboard.html" class="back-btn">
    ← Back to Dashboard
</a>

<div class="container">

<h2>

<i class="fa-solid fa-user"></i>

My Profile

</h2>

<div class="profile-card">

<div class="avatar" id="avatar">

U

</div>

<h3 id="fullname">

Loading...

</h3>

<p id="status">

Loading...

</p>

</div>

<div class="info-card">

<h3>Account Information</h3>

<div class="row">

<label>Email</label>

<p id="email"></p>

</div>

<div class="row">

<label>Phone</label>

<p id="phone"></p>

</div>

<div class="row">

<label>Referral Code</label>

<p id="referralCode"></p>

</div>

<div class="row">

<label>Question Wallet</label>

<p id="questionBalance"></p>

</div>

<div class="row">

<label>Referral Wallet</label>

<p id="referralBalance"></p>

</div>

</div>

<div class="actions">

<button id="editPhoneBtn">

<i class="fa-solid fa-phone"></i>

Edit Phone Number

</button>

<button id="changePasswordBtn">

<i class="fa-solid fa-lock"></i>

Change Password

</button>

</div>

</div>

<script src="js/profile.js"></script>

</body>

</html>
