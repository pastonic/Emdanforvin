<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Emdanforvin</title>
<link rel="icon" type="image/png" href="images/logo.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="css/auth.css">

</head>

<body>

<!-- Floating Particles -->

<div class="particles">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

<!-- Glass Card -->

<div class="auth-card">

<div class="logo-area">

<img
src="images/logo.png"
class="logo"
alt="Logo">

<h2>Forgot Password</h2>

<p>

Verify your account to reset your password.

</p>

</div>

<form id="resetForm">

<div class="form-group">

<input
type="text"
id="fullname"
required>

<label>

Full Name

</label>

<i class="fa-regular fa-user"></i>

</div>

<div class="form-group">

<input
type="email"
id="email"
required>

<label>

Email Address

</label>

<i class="fa-regular fa-envelope"></i>

</div>

<div class="form-group">

<input
type="text"
id="phone"
required>

<label>

Phone Number

</label>

<i class="fa-solid fa-phone"></i>

</div>

<div class="form-group password-group">

<input
type="password"
id="newPassword"
required>

<label>

New Password

</label>



<span id="togglePassword">
    <i class="fa-solid fa-eye-slash"></i>
</span>

</div>

<div class="form-group password-group">

<input
type="password"
id="confirmPassword"
required>

<label>

Confirm Password

</label>



<span id="toggleConfirm">
    <i class="fa-solid fa-eye-slash"></i>
</span>

</div>

<div id="message"></div>

<button
type="submit">

Reset Password

</button>

</form>

<div class="bottom-link">

Remember your password?

<a href="login.html">

Login

</a>

</div>

</div>

<script src="js/forgot-password.js"></script>

</body>

</html>
